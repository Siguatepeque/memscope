[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "memscope"
version = "0.1.0"
description = "A tiny memory and cache explorer for the terminal"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = ["textual>=8,<9"]

[project.scripts]
memscope = "memscope.app:main"

[tool.setuptools.packages.find]
where = ["src"]
